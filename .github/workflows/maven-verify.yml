name: Run `mvn verify` on JDK 17
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: ${{ matrix.distribution || 'temurin' }}
        architecture: ${{ matrix.arch }}
        cache: maven

    - name: Build and Verify with Maven
      run: mvn -B verify
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
